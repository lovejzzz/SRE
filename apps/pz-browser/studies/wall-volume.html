<!doctype html><html lang="en"><meta charset="utf-8"><title>Tian House · Wall volume study</title>
<style>body{margin:0;background:#17231f;color:#e5e2d5;font:14px system-ui}header{padding:20px;position:absolute;z-index:1}h1{font:28px Georgia;margin:0 0 10px}button{padding:9px 16px;margin:4px;background:#d8cda8;color:#243126;border:0;border-radius:5px}p{max-width:560px}canvas{display:block;width:100vw;height:100vh}#status{color:#c8bfa4}</style>
<header><h1>Wall volume study</h1><p>Physical wall geometry · 20 cm thick · 3 m high. Diagnostic materials; not the final art style.</p><button id="rotate">Rotate view</button><button id="opening">Switch window / door</button><button id="junctions">Toggle junction study</button><button id="picture">Toggle picture glazing</button><button id="roof">Toggle asymmetric roof</button><button id="doorpose">Open / close door</button><button id="step">Walk forward 0.4 m</button><button id="resetbody">Reset body</button><button id="dropbody">Drop body from 4 m</button><button id="tick">Advance physics 0.2 s</button><p id="body-status" role="status">Physical test body · 0.5 × 0.5 × 1.8 m · gravity enabled · no stairs</p><p id="status" role="status"></p></header><canvas></canvas>
<script type="module">
import * as THREE from '../node_modules/three/build/three.module.js';
import {stepPhysicalBody} from '../src/physical-body.js';
import {prismSolid} from '../src/prism-solid.js';
import {sceneRoofMeshes} from '../src/scene-roof-meshes.js';
import {openingFrameJoins} from '../src/opening-frame-joins.js';
import {openingVolume} from '../src/opening-volume.js';
import {sceneWallVolumes} from '../src/scene-wall-volumes.js';
const canvas=document.querySelector('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.setClearColor('#17231f');
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(36,1,.1,100);camera.up.set(0,0,1);
scene.add(new THREE.HemisphereLight(0xfff5df,0x344d45,2));const sun=new THREE.DirectionalLight(0xffe8c5,3);sun.position.set(3,-4,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.normalBias=.015;sun.shadow.bias=-.00002;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x456055,roughness:1}));ground.receiveShadow=true;ground.position.z=-.02;scene.add(ground);
const source={levels:[{id:'ground',index:0}],walls:[{id:'study-wall',levelId:'ground',axis:'N',x:0,y:0,tile:'study-plaster'}],openings:[{id:'study-aperture',hostWallId:'study-wall',kind:'window',tile:'study-window'}]};
const properties={'study-window':{TianWindowProfile:[.2,.2,.8,.75]},'study-door':{TianDoorProfile:[.3,.2,.7,1]}},metrics={cellSize:3,storeyHeight:3,wallHeight:3,thickness:.2};let mesh,angle=-Math.PI/3,door=false,joined=false,picture=false,roof=false,doorOpen=false,solids=[],bodyPosition=[1.5,-2,.9],verticalVelocity=0;
const actor=new THREE.Mesh(new THREE.BoxGeometry(.5,.5,1.8),new THREE.MeshStandardMaterial({color:0xc8aa62}));actor.position.set(...bodyPosition);scene.add(actor);
function build(){if(mesh){scene.remove(mesh);mesh.traverse(child=>{child.geometry?.dispose();child.material?.dispose();});}source.openings=source.openings.slice(0,1);delete source.openings[0].assemblyId;source.openings[0].kind=door?'door':'window';source.openings[0].tile=door?'study-door':'study-window';source.walls=source.walls.slice(0,1);if(joined)source.walls.push(...[{id:'left',axis:'W',x:0,y:0},{id:'branch',axis:'W',x:1,y:0},{id:'extension',axis:'N',x:1,y:0},{id:'diagonal',axis:'D+',x:1,y:1}].map(w=>({...w,levelId:'ground',tile:'study-plaster'})));
if(picture){source.walls=source.walls.slice(0,1);source.walls.push({...source.walls[0],id:'picture-right',x:1});source.openings=[{id:'picture-left',hostWallId:'study-wall',kind:'window',tile:'fixed',assemblyId:'picture'},{id:'picture-right',hostWallId:'picture-right',kind:'window',tile:'fixed',assemblyId:'picture'}];properties.fixed={TianGlazing:'fixed',WindowN:''};}else{source.openings[0].id='study-aperture';}const result=sceneWallVolumes(source,properties,metrics);mesh=new THREE.Group();solids=[prismSolid({polygon:[[-10,-10],[10,-10],[10,10],[-10,10]],minZ:-.22,maxZ:-.02})];let triangles=0,cells=0;
const joins=openingFrameJoins(result.volumes,source.openings,properties),assembly=result.volumes.flatMap(host=>{const o=source.openings.find(o=>o.id===host.openingId);return o?openingVolume({id:o.id,a:host.hostEndpoints[0],b:host.hostEndpoints[1],base:host.base,aperture:host.opening,kind:o.kind,angle:o.kind==='door'&&doorOpen?Math.PI/2:0,frameSides:joins.get(o.id)||[true,true],frameWidth:.06,frameDepth:.12,panelDepth:o.kind==='door'?.04:.008}):[];});const roofs=roof?sceneRoofMeshes({roofVolumes:[{id:'study-roof',levelId:'ground',elevationUnit:'storeys',surfaceTile:'study-plaster',closureTile:'study-plaster',vertices:[[0,0],[2,0],[2,1],[0,1]],baseElevation:1,profile:{axis:'X',knots:[[0,1],[.35,1.6],[1,1.2]]}}]},{cellSize:3,storeyHeight:3,roofThickness:.15,wallThickness:.2}):[];for(const volume of [...result.volumes,...assembly,...roofs]){solids.push(...(volume.collision||[]).map(c=>c.kind==='convex'?c:prismSolid(c)));const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(volume.vertices.flat(),3));g.setIndex(volume.indices);const flat=g.toNonIndexed();g.dispose();flat.computeVertexNormals();const part=new THREE.Mesh(flat,new THREE.MeshStandardMaterial({color:volume.role==='roof'?0x52635f:volume.role==='glass'?0x93bfbb:volume.role==='frame'?0x303b36:volume.role==='leaf'?0x8d7151:0xe7d9b9,roughness:.85,transparent:volume.role==='glass',opacity:volume.role==='glass'?.3:1,depthWrite:volume.role!=='glass'}));part.castShadow=volume.role!=='glass';part.receiveShadow=true;mesh.add(part);triangles+=volume.indices.length/3;cells+=volume.collision?.length||0;}scene.add(mesh);document.querySelector('#status').textContent=`${result.volumes.length} walls · ${triangles} triangles · ${cells} shared collision bodies`;
}
function draw(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();const radius=joined||picture||roof?15:8,cx=joined||picture||roof?3:1.5,cy=joined?2:0;camera.position.set(cx+radius*Math.cos(angle),cy+radius*Math.sin(angle),joined?10:5.5);camera.lookAt(cx,cy,1.3);renderer.render(scene,camera);}
document.querySelector('#rotate').onclick=()=>{angle+=Math.PI/3;draw();};document.querySelector('#opening').onclick=()=>{door=!door;build();draw();};document.querySelector('#junctions').onclick=()=>{joined=!joined;build();draw();};document.querySelector('#picture').onclick=()=>{picture=!picture;build();draw();};document.querySelector('#roof').onclick=()=>{roof=!roof;build();draw();};function step(delta){const result=stepPhysicalBody(solids,{position:bodyPosition,verticalVelocity},[delta[0]/.2,delta[1]/.2],.2,[.25,.25,.9]);bodyPosition=result.position;verticalVelocity=result.verticalVelocity;actor.position.set(...bodyPosition);document.querySelector('#body-status').textContent=`Physical test body · x ${bodyPosition[0].toFixed(3)} · y ${bodyPosition[1].toFixed(3)} · z ${bodyPosition[2].toFixed(3)} · ${result.grounded?'Grounded':'Falling'} · ${result.blocked?'Contact':'Clear'} · gravity enabled · no stairs`;draw();}
document.querySelector('#step').onclick=()=>step([0,.4,0]);document.querySelector('#resetbody').onclick=()=>{bodyPosition=[1.5,-2,.9];verticalVelocity=0;step([0,0,0]);};document.querySelector('#doorpose').onclick=()=>{doorOpen=!doorOpen;build();draw();};
document.querySelector('#dropbody').onclick=()=>{bodyPosition=[1.5,-2,4];verticalVelocity=0;step([0,0,0]);};document.querySelector('#tick').onclick=()=>step([0,0,0]);
onkeydown=e=>{const moves={ArrowUp:[0,.4,0],ArrowDown:[0,-.4,0],ArrowLeft:[-.4,0,0],ArrowRight:[.4,0,0]};if(moves[e.key]){e.preventDefault();step(moves[e.key]);}};onresize=draw;build();draw();
</script></html>
